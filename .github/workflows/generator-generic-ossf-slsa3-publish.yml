
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Da Vinci Epoxy Belgium | فخامة أرضيات الإيبوكسي</title>
    <style>
        :root {
            --primary-color: #bfa15f; /* لون ذهبي فاخر */
            --dark-color: #111111;
            --light-color: #ffffff;
            --gray-color: #f4f4f4;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-color);
            color: var(--dark-color);
            line-height: 1.6;
        }

        /* الهيدر وشريط التنقل */
        header {
            background-color: rgba(17, 17, 17, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--primary-color);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .logo {
            color: var(--light-color);
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--primary-color);
        }

        .nav-links {
            list-style: none;
            display: flex;
        }

        .nav-links li {
            margin-right: 20px;
        }

        .nav-links a {
            color: var(--light-color);
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        /* القسم الرئيسي (Hero Section) */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://unsplash.com') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--light-color);
            padding: 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .btn {
            background-color: var(--primary-color);
            color: var(--dark-color);
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--light-color);
            color: var(--dark-color);
        }

        /* قسم الخدمات */
        .services {
            padding: 80px 20px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .section-title {
            font-size: 36px;
            margin-bottom: 40px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background-color: var(--primary-color);
            margin: 10px auto 0;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .service-card {
            background-color: var(--gray-color);
            padding: 40px 20px;
            border-radius: 8px;
            transition: 0.3s;
            border-top: 4px solid transparent;
        }

        .service-card:hover {
            transform: translateY(-10px);
            border-top: 4px solid var(--primary-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .service-card h3 {
            margin-bottom: 15px;
            font-size: 22px;
        }

        /* قسم من نحن */
        .about {
            background-color: var(--dark-color);
            color: var(--light-color);
            padding: 80px 20px;
            text-align: center;
        }

        .about p {
            max-width: 800px;
            margin: 0 auto 30px;
            font-size: 18px;
            color: #ccc;
        }

        /* قسم الاتصال */
        .contact {
            padding: 80px 20px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        .contact form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .contact input, .contact textarea {
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            width: 100%;
        }

        /* الفوتر */
        footer {
            background-color: #000;
            color: #777;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- شريط التنقل -->
    <header>
        <div class="nav-container">
            <div class="logo">Da Vinci <span>Epoxy</span></div>
            <ul class="nav-links">
                <li><a href="#">الرئيسية</a></li>
                <li><a href="#services">خدماتنا</a></li>
                <li><a href="#about">من نحن</a></li>
                <li><a href="#contact">اتصل بنا</a></li>
            </ul>
        </div>
    </header>

    <!-- القسم الرئيسي -->
    <section class="hero">
        <h1>Da Vinci Epoxy Belgium</h1>
        <p>نحول أرضياتكم إلى لوحات فنية تدوم طويلاً. متخصصون في تركيب أرضيات الإيبوكسي الفاخرة للمنازل والمحلات والمصانع في بلجيكا.</p>
        <a href="#contact" class="btn">اطلب استشارة مجانية</a>
    </section>

    <!-- قسم الخدمات -->
    <section id="services" class="services">
        <h2 class="section-title">خدماتنا المتميزة</h2>
        <div class="services-grid">
            <div class="service-card">
                <h3>الإيبوكسي السكني الفاخر</h3>
                <p>تصاميم عصرية وثلاثية الأبعاد تناسب الصالونات والمطابخ والمطاعم بلمسات رخامية ساحرة.</p>
            </div>
            <div class="service-card">
                <h3>الإيبوكسي الصناعي والتجاري</h3>
                <p>أرضيات شديدة التحمل ومقاومة للمواد الكيميائية، مثالية للمستودعات، الكراجات والمستشفيات.</p>
            </div>
            <div class="service-card">
                <h3>ترميم الخرسانة وعزلها</h3>
                <p>معالجة الشقوق وتجهيز الأسطح بدقة عالية لضمان ثبات ومقاومة الرطوبة لسنوات طويلة.</p>
            </div>
        </div>
    </section>

    <!-- قسم من نحن -->
    <section id="about" class="about">
        <h2 class="section-title" style="color: var(--light-color);">من نحن</h2>
        <p>في <strong>Da Vinci Epoxy Belgium</strong>، نجمع بين دقة الهندسة البلجيكية وإبداع الفن اللامتناهي. نحن فريق محترف يمتلك خبرة سنوات في ابتكار حلول الأرضيات السلسة والمقاومة، ملتزمون بالجودة العالية والمواعيد الصارمة لتقديم أفضل النتائج لعملائنا.</p>
    </section>

    <!-- قسم الاتصال -->
    <section id="contact" class="contact">
        <h2 class="section-title">تواصل معنا اليوم</h2>
        <p>هل لديك مشروع قادم؟ اترك لنا رسالة وسنقوم بالرد عليك في أقرب وقت.</p>
        <form>
            <input type="text" placeholder="الاسم الكامل" required>
            <input type="email" placeholder="البريد الإلكتروني" required>
            <input type="tel" placeholder="رقم الهاتف">
            <textarea rows="5" placeholder="تفاصيل مشروعك (المساحة، نوع الإيبوكسي...)" required></textarea>
            <button type="submit" class="btn">إرسال الطلب</button>
        </form>
    </section>

    <!-- الفوتر -->
    <footer>
        <p>&copy; 2026 Da Vinci Epoxy Belgium. جميع الحقوق محفوظة.</p>
    </footer>

</body>
</html>



# This workflow lets you generate SLSA provenance file for your project.
# The generation satisfies level 3 for the provenance requirements - see https://slsa.dev/spec/v0.1/requirements
# The project is an initiative of the OpenSSF (openssf.org) and is developed at
# https://github.com/slsa-framework/slsa-github-generator.
# The provenance file can be verified using https://github.com/slsa-framework/slsa-verifier.
# For more information about SLSA and how it improves the supply-chain, visit slsa.dev.

name: SLSA generic generator
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v4

      # ========================================================
      #
      # Step 1: Build your artifacts.
      #
      # ========================================================
      - name: Build artifacts
        run: |
            # These are some amazing artifacts.
            echo "artifact1" > artifact1
            echo "artifact2" > artifact2

      # ========================================================
      #
      # Step 2: Add a step to generate the provenance subjects
      #         as shown below. Update the sha256 sum arguments
      #         to include all binaries that you generate
      #         provenance for.
      #
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail

          # List the artifacts the provenance will refer to.
          files=$(ls artifact*)
          # Generate the subjects (base64 encoded).
          echo "hashes=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true # Optional: Upload to a new release
